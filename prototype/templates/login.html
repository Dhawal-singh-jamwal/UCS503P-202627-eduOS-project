<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduOS - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>EduOS</h1>

            <p class="subtitle">
                Academic Computing Platform
            </p>

            <h2>Student Login</h2>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">

                <label for="roll_number">
                    Roll Number
                </label>

                <input
                    type="text"
                    id="roll_number"
                    name="roll_number"
                    placeholder="Enter roll number"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

        </div>

    </div>

</body>

</html>
